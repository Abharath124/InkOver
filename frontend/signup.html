<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up for InkOver – Create Your Screen Studio Account</title>
  <meta name="description" content="Sign up for InkOver Studio. Fast, minimal registration with Google OAuth support and instant access to your account dashboard.">
  <link rel="icon" type="image/png" href="assets/images/app_icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth-dashboard.css">
</head>
<body class="auth-page">

  <!-- Ambient Glow Orbs -->
  <div class="auth-ambient-glow auth-glow-1"></div>
  <div class="auth-ambient-glow auth-glow-2"></div>

  <!-- Minimal Header -->
  <header class="site-header" style="background: rgba(11, 15, 25, 0.4); border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
    <div class="container">
      <div class="nav-inner" style="height: 70px;">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            </svg>
          </div>
          <div class="brand-text">Ink<span class="brand-pen">Over</span></div>
        </a>
        <div class="nav-actions">
          <span style="font-size: 0.88rem; color: #94A3B8;">Already registered?</span>
          <a href="login.html" class="btn btn-outline" style="padding: 7px 16px; font-size: 0.82rem;">Log In</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Auth Main Center -->
  <main class="auth-container">
    <div class="auth-card">
      
      <div class="auth-header">
        <div class="auth-badge">Instant Setup</div>
        <h1>Get Started Free</h1>
        <p>Unlock professional on-screen markup studio in seconds.</p>
      </div>

      <!-- Google One-Click Login -->
      <button type="button" class="btn-google" id="btnGoogleSignup">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.98 0 12s.45 3.83 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>or sign up with email</span>
      </div>

      <!-- Minimal Form -->
      <form id="signupForm">
        <div class="form-group">
          <label class="form-label" for="userName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="userName" class="form-input" placeholder="e.g. Sarah Connor" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="userEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="userEmail" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="userPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="userPassword" class="form-input" placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <div class="form-row-space" style="margin-bottom: 24px;">
          <label class="form-checkbox-label">
            <input type="checkbox" id="termsCheck" required checked>
            <span>I agree to the <a href="#" class="auth-link">Terms</a> &amp; <a href="#" class="auth-link">Privacy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-brand btn-submit">
          Create Account &rarr;
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" class="auth-link">Sign in here</a>
      </div>

    </div>
  </main>

  <script src="js/auth-pricing.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');
      const googleBtn = document.getElementById('btnGoogleSignup');

      // Check if plan parameter is passed in url
      const urlParams = new URLSearchParams(window.location.search);
      const planParam = urlParams.get('plan');
      if (planParam) {
        showAppToast(`Selected plan: ${planParam.toUpperCase()}. Complete signup to continue!`);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('userName').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const pass = document.getElementById('userPassword').value;

        if (!name || !email || !pass) return;

        const user = authSignup(name, email, pass);
        showAppToast(`Welcome aboard, ${user.name}! Taking you to desktop download...`);

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      });

      googleBtn.addEventListener('click', () => {
        const user = authGoogleLogin();
        showAppToast(`Signed in with Google as ${user.email}!`);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      });
    });
  </script>
</body>
</html>
